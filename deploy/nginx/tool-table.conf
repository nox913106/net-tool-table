# =============================================================================
# Tool Table — nginx site (rendered by scripts/tool-table.sh install/upgrade)
#
#   :__HTTP_PORT__  (HTTP)   → 301 to https://<host>:__HTTPS_PORT__
#   :__HTTPS_PORT__ (HTTPS)  → reverse proxy to the app on 127.0.0.1:__APP_PORT__
#
# The app itself only listens on 127.0.0.1, so its service port is never
# reachable from the network; nginx is the only entry point.
# Certificate: /etc/tool-table/tls/server.{crt,key} (self-signed at install;
# replace the files with a real certificate and `systemctl reload nginx`).
#
# Do not edit the copy in /etc/nginx: it is regenerated on upgrade.
# Change ports with: sudo bash /opt/tool-table/scripts/tool-table.sh install --https-port N
# =============================================================================

upstream tool_table_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 16;
}

# Light protection for write endpoints (admin API). Reads are not limited:
# an empty key means "not counted".
map $request_method $tool_table_write_key {
    default "";
    POST    $binary_remote_addr;
    PUT     $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
limit_req_zone $tool_table_write_key zone=tool_table_write:10m rate=120r/m;
# Sign-in attempts: 10 per minute per address (the app also locks out repeated failures)
limit_req_zone $binary_remote_addr zone=tool_table_login:10m rate=10r/m;
limit_req_status 429;

# --- HTTP: redirect everything to HTTPS on the service port ---
#__HTTP_BLOCK_START__
server {
    listen __HTTP_PORT__ default_server;
    listen [::]:__HTTP_PORT__ default_server;
    server_name _;
    server_tokens off;

    location / {
        return 301 https://$host:__HTTPS_PORT__$request_uri;
    }
}
#__HTTP_BLOCK_END__

# --- HTTPS ---
server {
    listen __HTTPS_PORT__ ssl http2 default_server;
    listen [::]:__HTTPS_PORT__ ssl http2 default_server;
    server_name __SERVER_NAME__;
    server_tokens off;

    ssl_certificate     /etc/tool-table/tls/server.crt;
    ssl_certificate_key /etc/tool-table/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:ToolTableSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Someone typed http://host:__HTTPS_PORT__ → nginx error 497 → send them to https
    error_page 497 =301 https://$host:__HTTPS_PORT__$request_uri;

    include /etc/nginx/snippets/tool-table-headers.conf;
    # Page CSP: scripts only from this site (no third-party script at all).
    # connect-src allows ipinfo.io only for the optional "public IP" header chip.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://ipinfo.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 6m;   # icon uploads (app limit: 5 MB); larger limits below

    access_log /var/log/nginx/tool-table.access.log;
    error_log  /var/log/nginx/tool-table.error.log;

    # Uploaded icons (may be SVG): serve them sandboxed so an SVG can never run script
    location /resource/icon/ {
        proxy_pass http://tool_table_app;
        include /etc/nginx/snippets/tool-table-proxy.conf;
        proxy_hide_header Content-Security-Policy;   # the app sets the same policy; send it once
        include /etc/nginx/snippets/tool-table-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        expires 7d;
    }

    location = /api/auth/login {
        limit_req zone=tool_table_login burst=10 nodelay;
        proxy_pass http://tool_table_app;
        include /etc/nginx/snippets/tool-table-proxy.conf;
    }

    # Attachments on board cards / comments (app limit: images 10 MB, documents 25 MB)
    location ~ ^/api/tasks/[0-9]+/images$ {
        client_max_body_size 26m;
        limit_req zone=tool_table_write burst=60 nodelay;
        proxy_pass http://tool_table_app;
        include /etc/nginx/snippets/tool-table-proxy.conf;
    }

    # Opening / downloading an attachment: the app sets its own CSP (sandboxed; PDFs viewable),
    # so the page CSP above is not added here (a location with add_header inherits none).
    location ~ ^/api/tasks/[0-9]+/images/[0-9]+$ {
        limit_req zone=tool_table_write burst=60 nodelay;
        proxy_pass http://tool_table_app;
        include /etc/nginx/snippets/tool-table-proxy.conf;
        include /etc/nginx/snippets/tool-table-headers.conf;
    }

    # Backup files uploaded from 系統設定 → 備份 (app limit: 500 MB)
    location = /api/system/backups/upload {
        client_max_body_size 510m;
        proxy_request_buffering off;
        proxy_pass http://tool_table_app;
        include /etc/nginx/snippets/tool-table-proxy.conf;
    }

    location /api/ {
        limit_req zone=tool_table_write burst=60 nodelay;
        proxy_pass http://tool_table_app;
        include /etc/nginx/snippets/tool-table-proxy.conf;
    }

    location / {
        proxy_pass http://tool_table_app;
        include /etc/nginx/snippets/tool-table-proxy.conf;
    }
}
