# Promotional website (site/) → GitHub Pages: https://nox913106.github.io/net-tool-table/
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true          # turns Pages on when the token may; otherwise set it once in Settings
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:                           # a separate job, so the uploaded site is registered before it is fetched
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
