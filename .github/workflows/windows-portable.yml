name: Windows portable build

# Builds ToolTable.exe (no install needed) on a Windows runner, starts it to make
# sure it really serves the portal, then publishes ToolTable-windows-x64.zip:
#   push to main  → release "latest" (asset replaced on every build)
#   push tag v*   → release for that tag
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Sync token protection (Windows DPAPI round trip)
        run: python -c "from app.syncclient import _protect, _unprotect; t = _protect('tok-123'); assert t.startswith('dpapi:'), t; assert _unprotect(t) == 'tok-123'; print('DPAPI ok')"

      - name: Build ToolTable.exe
        run: pyinstaller --noconfirm portable/ToolTable.spec

      - name: Smoke test (start the exe and request pages)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\ToolTable\ToolTable.exe -ArgumentList '--no-browser', '--port', '18080' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try { if ((Invoke-RestMethod http://127.0.0.1:18080/api/health).status -eq 'ok') { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          if ($ok) {
            foreach ($u in '/', '/admin', '/assets/js/portal.js', '/assets/css/base.css', '/resource/icon/grafana_icon.svg', '/api/nodes/tree', '/manifest.webmanifest', '/sw.js', '/assets/app/icon-512.png', '/assets/js/board.js', '/api/tasks', '/dashboard', '/api/public/dashboard', '/login', '/api/system/backup', '/api/system/info', '/api/openproject', '/api/system/openproject', '/api/sync/client', '/assets/js/sync.js') {
              $code = (Invoke-WebRequest "http://127.0.0.1:18080$u" -UseBasicParsing).StatusCode
              Write-Host "$u -> $code"
              if ($code -ne 200) { $ok = $false }
            }
            if (-not (Test-Path dist\ToolTable\data\tool-table.db)) { Write-Host 'data\tool-table.db was not created next to the exe'; $ok = $false }
          }

          # ---- local programs: real Windows shortcut, exe lookup, icon extraction, launch, guards
          if ($ok) {
            $B = 'http://127.0.0.1:18080'
            $H = @{ 'X-Tool-Table' = '1' }
            $notepad = "$env:SystemRoot\System32\notepad.exe"
            $lnkPath = Join-Path $env:RUNNER_TEMP 'Notepad Test.lnk'
            $ws = New-Object -ComObject WScript.Shell
            $sc = $ws.CreateShortcut($lnkPath)
            $sc.TargetPath = $notepad
            $sc.Arguments = '/A'
            $sc.WorkingDirectory = $env:SystemRoot
            $sc.Save()

            # board images: a real PNG is accepted, anything else refused
            $png = Join-Path $env:RUNNER_TEMP 'pixel.png'
            [IO.File]::WriteAllBytes($png, [Convert]::FromBase64String('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='))
            $card = Invoke-RestMethod "$B/api/tasks" -Method Post -Headers $H -ContentType 'application/json' -Body (@{ title = 'CI image'; status = 'new' } | ConvertTo-Json)
            $im = Invoke-RestMethod "$B/api/tasks/$($card.id)/images" -Method Post -Headers $H -Form @{ file = Get-Item $png; target = 'card' }
            $got = Invoke-WebRequest "$B$($im.url)" -UseBasicParsing
            Write-Host "image upload → $($im.url) ($($got.Headers['Content-Type']))"
            if ($got.Headers['Content-Type'] -notlike 'image/png*') { throw 'board image not served back' }
            $md = Join-Path $env:RUNNER_TEMP 'notes.md'
            Set-Content -Path $md -Value '# CI notes' -Encoding utf8
            $doc = Invoke-RestMethod "$B/api/tasks/$($card.id)/images" -Method Post -Headers $H -Form @{ file = Get-Item $md; target = 'card' }
            Write-Host "document upload → $($doc.kind) $($doc.url)"
            if ($doc.kind -ne 'file') { throw 'document attachment not accepted' }
            $bad = Join-Path $env:RUNNER_TEMP 'evil.html'
            Set-Content -Path $bad -Value '<script>alert(1)</script>'
            $code = (Invoke-WebRequest "$B/api/tasks/$($card.id)/images" -Method Post -Headers $H -Form @{ file = Get-Item $bad } -SkipHttpErrorCheck -UseBasicParsing).StatusCode
            Write-Host "html upload → $code (expect 400)"
            if ($code -ne 400) { throw 'html attachment was not refused' }
            # Excel export (openpyxl must be in the build)
            $xlsx = Join-Path $env:RUNNER_TEMP 'cards.xlsx'
            Invoke-WebRequest "$B/api/tasks/export.xlsx" -Method Post -Headers $H -ContentType 'application/json' -Body (@{ ids = @($card.id) } | ConvertTo-Json) -OutFile $xlsx -UseBasicParsing
            $sig = [IO.File]::ReadAllBytes($xlsx)[0..1]
            Write-Host "excel export → $((Get-Item $xlsx).Length) bytes"
            if ($sig[0] -ne 0x50 -or $sig[1] -ne 0x4B) { throw 'excel export is not an xlsx file' }
            # the same report reads back (preview only: nothing changes)
            $imp = Invoke-RestMethod "$B/api/tasks/import.xlsx" -Method Post -Headers $H -Form @{ file = Get-Item $xlsx; apply = 'false' }
            Write-Host "excel import preview → $($imp.rows.Count) rows, unchanged=$($imp.counts.unchanged)"
            if ($imp.rows.Count -lt 1 -or $imp.rows[0].action -ne 'unchanged') { throw 'excel import preview failed' }
            Invoke-RestMethod "$B/api/tasks/$($card.id)" -Method Delete -Headers $H | Out-Null

            $w = Invoke-RestMethod "$B/api/whoami"
            Write-Host "whoami → ip=$($w.ip) host=$($w.host) all=$($w.all -join ',')"
            if (-not $w.local -or $w.ip -like '127.*') { $ok = $false }

            $st = Invoke-RestMethod "$B/api/local/status"
            Write-Host "local status: enabled=$($st.enabled) allowed=$($st.allowed)"
            if (-not $st.allowed) { $ok = $false }

            $r = Invoke-RestMethod "$B/api/local/shortcut" -Method Post -Headers $H -Form @{ file = Get-Item $lnkPath }
            Write-Host "shortcut → target=$($r.path) args=$($r.args) icon=$($r.icon) name=$($r.name)"
            if ($r.path -notlike '*notepad.exe' -or $r.args -ne '/A' -or -not $r.icon) { $ok = $false }

            $size = (Get-Item $notepad).Length
            $f = Invoke-RestMethod "$B/api/local/resolve" -Method Post -Headers $H -ContentType 'application/json' -Body (@{ name = 'notepad.exe'; size = $size } | ConvertTo-Json)
            Write-Host "resolve → found=$($f.found) path=$($f.path) icon=$($f.icon)"
            if (-not $f.found -or -not $f.icon) { $ok = $false }

            $node = Invoke-RestMethod "$B/api/nodes" -Method Post -Headers $H -ContentType 'application/json' -Body (@{ name = 'Notepad'; node_type = 'link'; url = $notepad } | ConvertTo-Json)
            Write-Host "program node url=$($node.url)"
            Get-Process notepad -ErrorAction SilentlyContinue | Stop-Process -Force
            Invoke-RestMethod "$B/api/launch/$($node.id)" -Method Post -Headers $H | Out-Null
            Start-Sleep -Seconds 3
            $np = Get-Process notepad -ErrorAction SilentlyContinue
            Write-Host "notepad running after launch: $([bool]$np)"
            if (-not $np) { $ok = $false }
            $np | Stop-Process -Force -ErrorAction SilentlyContinue

            $code = (Invoke-WebRequest "$B/api/launch/$($node.id)" -Method Post -SkipHttpErrorCheck -UseBasicParsing).StatusCode
            Write-Host "launch without X-Tool-Table header → $code (expect 403)"
            if ($code -ne 403) { $ok = $false }
            $code = (Invoke-WebRequest "$B/api/launch/$($node.id)" -Method Post -Headers @{ 'X-Tool-Table' = '1'; 'Host' = 'evil.example.com' } -SkipHttpErrorCheck -UseBasicParsing).StatusCode
            Write-Host "launch with foreign Host header → $code (expect 403)"
            if ($code -ne 403) { $ok = $false }
          }
          Stop-Process -Id $proc.Id -Force
          Start-Sleep -Seconds 2
          if (-not $ok) { throw 'Smoke test failed' }
          Remove-Item -Recurse -Force dist\ToolTable\data

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item portable\README.txt dist\ToolTable\README.txt
          Compress-Archive -Path dist\ToolTable -DestinationPath ToolTable-windows-x64.zip
          Get-Item ToolTable-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ToolTable-windows-x64
          path: ToolTable-windows-x64.zip

      - name: Publish to GitHub Releases
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; TITLE="Tool Table $TAG"
          else
            TAG="latest"; TITLE="Tool Table（最新版）"
            git tag -f latest
            git push -f origin refs/tags/latest
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TITLE" --notes-file portable/RELEASE_NOTES.md
          gh release upload "$TAG" ToolTable-windows-x64.zip --clobber
