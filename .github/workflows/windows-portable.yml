name: Windows portable build

# Builds ToolTable.exe (no install needed) on a Windows runner, starts it to make
# sure it really serves the portal, then publishes ToolTable-windows-x64.zip:
#   push to main  → release "latest" (asset replaced on every build)
#   push tag v*   → release for that tag
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build ToolTable.exe
        run: pyinstaller --noconfirm portable/ToolTable.spec

      - name: Smoke test (start the exe and request pages)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\ToolTable\ToolTable.exe -ArgumentList '--no-browser', '--port', '18080' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            try { if ((Invoke-RestMethod http://127.0.0.1:18080/api/health).status -eq 'ok') { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          if ($ok) {
            foreach ($u in '/', '/admin', '/assets/js/portal.js', '/assets/css/base.css', '/resource/icon/grafana_icon.svg', '/api/nodes/tree') {
              $code = (Invoke-WebRequest "http://127.0.0.1:18080$u" -UseBasicParsing).StatusCode
              Write-Host "$u -> $code"
              if ($code -ne 200) { $ok = $false }
            }
            if (-not (Test-Path dist\ToolTable\data\tool-table.db)) { Write-Host 'data\tool-table.db was not created next to the exe'; $ok = $false }
          }
          Stop-Process -Id $proc.Id -Force
          Start-Sleep -Seconds 2
          if (-not $ok) { throw 'Smoke test failed' }
          Remove-Item -Recurse -Force dist\ToolTable\data

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item portable\README.txt dist\ToolTable\README.txt
          Compress-Archive -Path dist\ToolTable -DestinationPath ToolTable-windows-x64.zip
          Get-Item ToolTable-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ToolTable-windows-x64
          path: ToolTable-windows-x64.zip

      - name: Publish to GitHub Releases
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; TITLE="Tool Table $TAG"
          else
            TAG="latest"; TITLE="Tool Table（最新版）"
            git tag -f latest
            git push -f origin refs/tags/latest
          fi
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TITLE" --notes-file portable/RELEASE_NOTES.md
          gh release upload "$TAG" ToolTable-windows-x64.zip --clobber
