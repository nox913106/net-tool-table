<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="dark" data-bg="aurora">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>IPMS</title>
  <link rel="icon" href="/assets/app/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/app/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0d1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/portal.css">
  <link rel="stylesheet" href="/assets/css/tactical.css">
  <script src="/assets/js/profile.js" defer></script>
  <script src="/assets/i18n/en.js" defer></script>
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/common.js" defer></script>
  <script src="/assets/js/clock.js" defer></script>
  <script src="/assets/js/board.js" defer></script>
  <script src="/assets/js/radar.js" defer></script>
  <script src="/assets/js/gantt.js" defer></script>
  <script src="/assets/js/projects.js" defer></script>
  <script src="/assets/js/help-zh.js" defer></script>
  <script src="/assets/js/help-en.js" defer></script>
  <script src="/assets/js/help.js" defer></script>
  <script src="/assets/js/portal.js" defer></script>
  <script src="/assets/js/sync.js" defer></script>
</head>
<body>
  <div class="backdrop"><div class="grid-lines"></div></div>

  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="開啟選單"></button>

    <a class="brand" id="brand" href="#/" aria-label="首頁">
      <span class="brand-mark" id="brand-mark"></span>
      <span class="brand-text">
        <strong id="brand-title">IPMS</strong>
        <small id="brand-subtitle"></small>
      </span>
    </a>

    <button class="search-trigger" id="search-trigger" type="button">
      <span class="search-trigger-icon" id="search-trigger-icon"></span>
      <span class="search-trigger-text" id="search-trigger-text">搜尋…</span>
      <span class="search-trigger-keys"><kbd id="mod-key">Ctrl</kbd><kbd>K</kbd></span>
    </button>

    <div class="topbar-right">
      <div class="netinfo" id="netinfo" hidden></div>
      <div class="clock" id="clock" hidden title="時間"></div>
      <button class="icon-btn bell-btn" id="bell-btn" type="button" title="待辦提醒" hidden></button>
      <button class="icon-btn" id="install-btn" type="button" title="安裝為應用程式（獨立視窗開啟）" hidden></button>
      <button class="icon-btn" id="perf-btn" type="button"></button>
      <button class="icon-btn" id="theme-btn" type="button"></button>
      <a class="icon-btn" id="admin-btn" href="/admin" title="管理後台" hidden></a>
      <div class="user-menu" id="user-menu" hidden></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="導覽">
      <nav class="nav" id="nav-main"></nav>

      <section class="nav-section" id="tree-section">
        <div class="nav-title" id="tree-title">分類</div>
        <div class="tree" id="tree" role="tree"></div>
      </section>

      <section class="nav-section" id="personal-section" hidden>
        <div class="nav-title nav-title-row"><span>個人區</span><button class="nav-add" id="personal-add" type="button" title="新增個人連結或資料夾"></button></div>
        <div class="tree" id="tree-personal" role="tree"></div>
      </section>

      <section class="nav-section" id="filters-section" hidden>
        <div class="nav-title" id="filters-title">快速篩選</div>
        <div class="filter-list" id="filters"></div>
      </section>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main" id="main">
      <div class="view" id="view" aria-live="polite"></div>
    </main>
  </div>

  <!-- Command palette -->
  <div class="modal palette" id="palette" hidden>
    <div class="modal-card palette-card" role="dialog" aria-modal="true" aria-label="搜尋">
      <div class="palette-input">
        <span class="palette-input-icon" id="palette-icon"></span>
        <input id="palette-input" type="text" autocomplete="off" spellcheck="false" placeholder="搜尋…">
        <kbd>Esc</kbd>
      </div>
      <div class="palette-results" id="palette-results" role="listbox"></div>
      <div class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> 選擇</span>
        <span><kbd>↵</kbd> 開啟</span>
        <span><kbd>Shift</kbd><kbd>↵</kbd> 全部結果</span>
      </div>
    </div>
  </div>
</body>
</html>
