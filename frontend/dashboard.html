<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="dark" data-bg="aurora">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>進度看板</title>
  <link rel="icon" href="/assets/app/favicon-32.png" type="image/png">
  <meta name="theme-color" content="#0a0d1a">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <script src="/assets/js/common.js" defer></script>
  <script src="/assets/js/dashboard.js" defer></script>
</head>
<body class="dash-page">
  <div class="backdrop"><div class="grid-lines"></div></div>
  <header class="dash-head">
    <div class="dash-brand">
      <span id="dash-mark"></span>
      <div>
        <h1 id="dash-title">任務進度看板</h1>
        <p id="dash-sub">各部門、各帳號的卡片狀態統計（不含週期工作）</p>
      </div>
    </div>
    <div class="dash-right">
      <span class="dash-live" id="dash-live" title="每 15 秒自動更新"><span class="dot"></span><span id="dash-time">—</span></span>
      <button class="icon-btn" id="theme-btn" type="button"></button>
      <a class="btn btn-sm" href="/" id="dash-login">登入</a>
    </div>
  </header>
  <main class="dash-main">
    <section class="dash-totals" id="dash-totals"></section>
    <section class="dash-grid" id="dash-grid"></section>
  </main>
</body>
</html>
